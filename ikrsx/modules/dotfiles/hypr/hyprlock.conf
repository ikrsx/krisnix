$font = "Inter"

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 0
    inner_color = rgba(88, 91, 112, 0.5)

    check_color = rgba(249, 226, 175, 0.5)
    fail_color = rgba(243, 139, 168, 0.5)

    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 50

    font_family = $font
    fail_text = $PAMFAIL$FPRINTFAIL

    dot_spacing = 0.5

    position = -300, 0
    halign = right
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = 300, 55
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font

    position = 300, -55
    halign = left
    valign = center
}
